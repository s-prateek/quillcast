platforms:
  linkedin:
    enabled: true
    token_file: data/tokens/linkedin.json

  facebook:
    enabled: false   # flip to true when ready — no code changes needed
    token_file: data/tokens/facebook.json

  blog:
    enabled: true
    type: ghost
    default_status: draft   # Ghost Admin draft — publish manually on the site

rss_feeds:
  hn:
    url: https://hnrss.org/frontpage
    category: tech
  techcrunch:
    url: https://feeds.feedburner.com/TechCrunch
    category: tech
  theverge:
    url: https://www.theverge.com/rss/index.xml
    category: tech
  ign:
    url: https://feeds.feedburner.com/ign/all
    category: gaming
  eurogamer:
    url: https://www.eurogamer.net/feed
    category: gaming
  steam:
    url: https://store.steampowered.com/feeds/news.xml
    category: gaming
  nintendo_life:
    url: https://www.nintendolife.com/feeds/latest
    category: gaming
  push_square:
    url: https://www.pushsquare.com/feeds/latest
    category: gaming

rss_filter:
  min_article_age_hours: 1
  max_article_age_hours: 48
  max_articles_per_run: 5
